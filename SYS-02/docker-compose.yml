x-airflow-common: &airflow-common
  build: .
  image: sys02-airflow:real
  environment: &airflow-env
    PYTHONPATH: /opt/airflow/src
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER:-airflow}:${POSTGRES_PASSWORD:-airflow_secret}@airflow_postgres:5432/${POSTGRES_DB:-airflow_db}
    AIRFLOW__CORE__FERNET_KEY: ''
    AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'false'
    AIRFLOW__API__AUTH_BACKENDS: airflow.api.auth.backend.basic_auth,airflow.api.auth.backend.session
    MINIO_ENDPOINT: ${MINIO_ENDPOINT:-host.docker.internal:9000}
    MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-admin123}
    MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-admin123}
    CLICKHOUSE_HOST: ${CLICKHOUSE_HOST:-host.docker.internal}
    CLICKHOUSE_PORT: ${CLICKHOUSE_PORT:-8123}
    CLICKHOUSE_USER: ${CLICKHOUSE_USER:-admin123}
    CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-admin123}
    SYS06_ALERT_URL: ${SYS06_ALERT_URL:-http://host.docker.internal:8080/alerts}
    SYS06_ALERT_API_TOKEN: ${SYS06_ALERT_API_TOKEN:-}
  extra_hosts:
    - host.docker.internal:host-gateway
  volumes:
    - ./dags:/opt/airflow/dags
    - ./src:/opt/airflow/src
    - ./logs:/opt/airflow/logs
  user: "${AIRFLOW_UID:-50000}:0"

services:
  airflow_postgres:
    image: postgres:15-alpine
    container_name: sys02_airflow_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-airflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-airflow_secret}
      POSTGRES_DB: ${POSTGRES_DB:-airflow_db}
    ports:
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-airflow} -d ${POSTGRES_DB:-airflow_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  airflow_init:
    <<: *airflow-common
    container_name: sys02_airflow_init
    depends_on:
      airflow_postgres:
        condition: service_healthy
    entrypoint: >
      /bin/bash -c "airflow db migrate && airflow users create --username admin123 --firstname Data --lastname Admin --role Admin --email admin@company.com --password admin123 || true"

  airflow_webserver:
    <<: *airflow-common
    container_name: sys02_airflow_webserver
    command: webserver
    depends_on:
      airflow_postgres:
        condition: service_healthy
      airflow_init:
        condition: service_completed_successfully
    ports:
      - "${AIRFLOW_WEBSERVER_PORT:-8085}:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped

  airflow_scheduler:
    <<: *airflow-common
    container_name: sys02_airflow_scheduler
    command: scheduler
    depends_on:
      airflow_postgres:
        condition: service_healthy
      airflow_init:
        condition: service_completed_successfully
    restart: unless-stopped

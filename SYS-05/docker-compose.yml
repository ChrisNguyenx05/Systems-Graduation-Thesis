services:
  # ---------------------------------------------------------------------------
  # MinIO Object Storage (S3 API & Web Console)
  # Credentials: admin123 / admin123
  # ---------------------------------------------------------------------------
  minio_s3:
    image: minio/minio@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    container_name: minio_s3
    restart: always
    networks:
      default:
        aliases:
          - minio
          - minio-s3
    ports:
      - "127.0.0.1:${MINIO_API_PORT:?Set MINIO_API_PORT in .env}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:?Set MINIO_CONSOLE_PORT in .env}:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:?Set MINIO_ACCESS_KEY in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:?Set MINIO_SECRET_KEY in .env}
    command: server /data --console-address ":9001"
    volumes:
      - ./data/minio:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # MinIO Bucket Auto-Initialization Task
  # ---------------------------------------------------------------------------
  minio_init:
    image: minio/mc@sha256:a7fe349ef4bd8521fb8497f55c6042871b2ae640607cf99d9bede5e9bdf11727
    container_name: minio_init
    depends_on:
      minio_s3:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc alias set myminio http://minio_s3:9000 ${MINIO_ACCESS_KEY:?Set MINIO_ACCESS_KEY in .env} ${MINIO_SECRET_KEY:?Set MINIO_SECRET_KEY in .env};
      /usr/bin/mc mb --ignore-existing myminio/${BUCKET_BRONZE:-crypto-bronze};
      /usr/bin/mc mb --ignore-existing myminio/${BUCKET_SILVER:-crypto-silver};
      /usr/bin/mc mb --ignore-existing myminio/${BUCKET_GOLD:-crypto-gold};
      /usr/bin/mc anonymous set download myminio/${BUCKET_BRONZE:-crypto-bronze};
      /usr/bin/mc anonymous set download myminio/${BUCKET_SILVER:-crypto-silver};
      /usr/bin/mc anonymous set download myminio/${BUCKET_GOLD:-crypto-gold};
      echo 'MinIO Medallion Buckets Initialized Successfully!';
      exit 0;
      "

  # ---------------------------------------------------------------------------
  # ClickHouse Real-time OLAP Analytical Engine
  # Credentials: admin123 / admin123
  # ---------------------------------------------------------------------------
  clickhouse_server:
    image: clickhouse/clickhouse-server@sha256:f90a77560f72b10802106ee49e9870e41668cbc496e280c3911f6e3b216657f3
    container_name: clickhouse_server
    restart: always
    ports:
      - "127.0.0.1:${CLICKHOUSE_HTTP_PORT:?Set CLICKHOUSE_HTTP_PORT in .env}:8123"   # ClickHouse HTTP Interface / Web UI
      - "127.0.0.1:${CLICKHOUSE_NATIVE_PORT:?Set CLICKHOUSE_NATIVE_PORT in .env}:9000"   # ClickHouse Native TCP Interface (mapped to 9004 on host)
    environment:
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:?Set CLICKHOUSE_USER in .env}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?Set CLICKHOUSE_PASSWORD in .env}
      CLICKHOUSE_DEFAULT_USER_PASSWORD: ${CLICKHOUSE_PASSWORD:?Set CLICKHOUSE_PASSWORD in .env}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    volumes:
      - ./data/clickhouse:/var/lib/clickhouse
      - ./sql/init_clickhouse_tables.sql:/docker-entrypoint-initdb.d/init_tables.sql
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8123/ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # PostgreSQL 15 Relational Metadata DB
  # Credentials: admin123 / admin123
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:15-alpine
    container_name: sys05_postgres
    restart: always
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:?Set POSTGRES_HOST_PORT in .env}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:?Set POSTGRES_USER in .env}"]
      interval: 5s
      timeout: 5s
      retries: 5

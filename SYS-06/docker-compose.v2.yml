services:
  sys06-alert-dispatcher-v2:
    build:
      context: .
      dockerfile: Dockerfile.v2
    env_file: .env
    ports:
      - "8080:8080"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - thesis-network

networks:
  thesis-network:
    external: true

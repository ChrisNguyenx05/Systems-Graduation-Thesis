services:
  sys06-alert-dispatcher:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sys06-alert-dispatcher
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - ALERT_DRY_RUN=${ALERT_DRY_RUN:-true}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID:-}
      - SLACK_WEBHOOK_URL=${SLACK_WEBHOOK_URL:-}
    volumes:
      - ./logs:/app/logs
    networks:
      - thesis-network

networks:
  thesis-network:
    name: thesis-network
    driver: bridge
